name: M0 Gate
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: aihub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AIHUB_TEST_DATABASE_URL: postgres://postgres:integration-only@127.0.0.1:5432/aihub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Install PostgreSQL 17 client (matches the postgres:17 service)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev curl ca-certificates lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
          # update-alternatives may keep pointing at 16; put 17 first in PATH
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - run: npm ci --prefix apps/web && npm test --prefix apps/web && npm run build --prefix apps/web
      - run: cp -R apps/web/dist/. server/webassets/dist/ && bash scripts/gate.sh
