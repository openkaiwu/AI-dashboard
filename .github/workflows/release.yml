name: Release Packages
on:
  workflow_dispatch:
    inputs:
      target:
        description: Platforms to build
        type: choice
        default: all
        options: [all, desktop, macos, ios]
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  desktop:
    if: ${{ inputs.target != 'ios' }}
    name: Desktop ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'macos' && '[{"runner":"macos-15","platform":"darwin","arch":"arm64","goarch":"arm64"},{"runner":"macos-15-intel","platform":"darwin","arch":"x64","goarch":"amd64"}]' || '[{"runner":"ubuntu-24.04","platform":"linux","arch":"x64","goarch":"amd64"},{"runner":"ubuntu-24.04-arm","platform":"linux","arch":"arm64","goarch":"arm64"},{"runner":"macos-15","platform":"darwin","arch":"arm64","goarch":"arm64"},{"runner":"macos-15-intel","platform":"darwin","arch":"x64","goarch":"amd64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate and build web
        run: |
          npm ci --prefix apps/web
          npm test --prefix apps/web
          npm run build --prefix apps/web
          rm -rf server/webassets/dist
          mkdir -p server/webassets/dist
          cp -R apps/web/dist/. server/webassets/dist/
          node --test apps/desktop/*.test.cjs
      - name: Build matching embedded binaries
        env:
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p artifacts/aihub-m0
          cd server
          for name in aihub aihub-bridge aihub-admin; do
            go build -trimpath -ldflags='-s -w' -o "../artifacts/aihub-m0/$name-$GOOS-$GOARCH" "./cmd/$name"
          done
      - name: Stage embedded binaries
        run: bash scripts/stage-desktop-binaries.sh '${{ matrix.platform }}' '${{ matrix.goarch }}'
      - name: Package desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci --prefix apps/desktop
          cd apps/desktop
          if [ '${{ matrix.platform }}' = darwin ]; then
            npx electron-builder --mac --${{ matrix.arch }} --publish never
          else
            npx electron-builder --linux --${{ matrix.arch }} --publish never
          fi
      - name: Verify and collect packages
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: node scripts/collect-platform-release.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: aihub-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/release/${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
  ios:
    if: ${{ inputs.target != 'macos' && inputs.target != 'desktop' }}
    name: iOS device IPA (requires user signing)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Analyze and test
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build unsigned iOS device app
        working-directory: apps/mobile
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          VER=$(awk '/^version:/ {split($2,v,"+"); print v[1]}' apps/mobile/pubspec.yaml)
          mkdir -p artifacts/release/ios/Payload
          cp -R apps/mobile/build/ios/iphoneos/Runner.app artifacts/release/ios/Payload/AIHub.app
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' artifacts/release/ios/Payload/AIHub.app/Info.plist
          cd artifacts/release/ios
          zip -qry "AIHub-$VER-unsigned.ipa" Payload
          rm -rf Payload
          shasum -a 256 *.ipa > SHA256SUMS-ios.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aihub-ios-unsigned
          path: artifacts/release/ios/
          if-no-files-found: error
