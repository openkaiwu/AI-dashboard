name: aihub
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: aihub
      POSTGRES_USER: aihub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong PostgreSQL password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihub -d aihub"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      AIHUB_ADDR: 0.0.0.0:8080
      AIHUB_DATABASE_URL: postgres://aihub:${POSTGRES_PASSWORD}@db:5432/aihub?sslmode=disable
      AIHUB_ALLOWED_ORIGINS: https://${AIHUB_DOMAIN:?Set your domain}
      AIHUB_DEMO: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  caddy:
    image: caddy:2
    environment:
      AIHUB_DOMAIN: ${AIHUB_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
