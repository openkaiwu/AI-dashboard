server {
    listen 80;
    server_name 203.0.113.10;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location /downloads/ {
        alias /var/www/aihub-downloads/;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="aihub-mobile.apk"';
        add_header Cache-Control 'public, max-age=300';
    }
    location = /downloads {
        return 301 /downloads/;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host 203.0.113.10;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 8888;
    server_name 203.0.113.10;
    location /downloads/ {
        alias /var/www/aihub-downloads/;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="aihub-mobile.apk"';
        add_header Cache-Control 'public, max-age=300';
    }
    location = /downloads {
        return 301 /downloads/;
    }
    location = / {
        root /var/www/aihub-downloads;
        index index.html;
    }
}
server {
    listen 443 ssl;
    server_name 203.0.113.10;
    ssl_certificate /etc/letsencrypt/live/203.0.113.10/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/203.0.113.10/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /downloads/ {
        alias /var/www/aihub-downloads/;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="aihub-mobile.apk"';
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host 203.0.113.10;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
