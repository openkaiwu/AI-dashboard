<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>连接 AI Hub 服务器</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{font:14px "Segoe UI","Microsoft YaHei UI",sans-serif;margin:0;background:#f6f8fc;color:#18243c;display:grid;min-height:100vh;place-items:center;padding:24px}main{width:min(440px,100%);padding:36px;background:#fff;border:1px solid #e3e9f2;border-radius:20px;box-shadow:0 8px 32px #1c2e530d}.brand{font-size:22px;font-weight:700;letter-spacing:-.6px;margin-bottom:30px}.brand span{color:#3563e9}h1{margin:0 0 12px;font-size:25px;letter-spacing:-.5px}p{color:#63718a;line-height:1.8;margin-bottom:24px}label{display:block;margin-bottom:8px;font-size:12px;color:#63718a}input,button{width:100%;padding:13px;border-radius:10px;font:inherit}input{background:#fff;border:1px solid #e3e9f2;color:#18243c}input:focus{outline:3px solid #3563e926;border-color:#3563e9}button{margin-top:18px;background:#3563e9;color:white;border:0;font-weight:600;cursor:pointer;min-height:44px}button:hover{background:#2953ce}button:focus-visible{outline:3px solid #3563e9;outline-offset:3px}#error{color:#c23c4c;margin:16px 0 0;font-size:12px}
</style></head><body><main><div class="brand">AI Hub<span>.</span></div><h1>连接 AI Hub</h1><p>输入管理员提供的 HTTPS 服务器根地址。此电脑绑定后会在后台连接服务器。</p><form id="form"><label for="url">服务器地址</label><input id="url" type="url" placeholder="https://your-hub.example" required autofocus><button>连接服务器</button></form><p id="error" role="alert"></p></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();try{await window.aihubDesktop.configureServer(document.getElementById('url').value);document.getElementById('error').textContent='正在连接…';}catch(err){document.getElementById('error').textContent=err.message||String(err);}});</script></body></html>
