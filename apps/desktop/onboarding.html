<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>连接 AI Hub 服务器</title><style>body{font:16px system-ui;margin:0;background:#101725;color:#eef4fa;display:grid;min-height:100vh;place-items:center}main{width:min(480px,90vw);padding:40px;background:#1d2b3c;border-radius:16px}h1{margin-top:0}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:8px;font:inherit}input{background:#f8fbff;border:0}button{margin-top:18px;background:#b7ea67;color:#172315;border:0;cursor:pointer}p{line-height:1.6}#error{color:#ffb4a9}</style></head><body><main><h1>连接 AI Hub</h1><p>输入管理员提供的 HTTPS 服务器根地址。此电脑绑定后会在后台连接服务器。</p><form id="form"><input id="url" type="url" placeholder="https://your-hub.example" required autofocus><button>连接服务器</button></form><p id="error" role="alert"></p></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();try{await window.aihubDesktop.configureServer(document.getElementById('url').value);document.getElementById('error').textContent='正在连接…';}catch(err){document.getElementById('error').textContent=err.message||String(err);}});</script></body></html>
